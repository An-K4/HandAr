name: Build Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  BUNDLETOOL_VERSION: "1.18.3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Dedicated CI keystore (NOT the Play upload key). Without it, release falls back to a
      # debug keystore generated per runner, so builds could not be installed over each other.
      - name: Decode CI keystore
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CI_KEYSTORE_BASE64" ]; then
            echo "::warning::CI_KEYSTORE_BASE64 secret is missing, signing with a throwaway debug keystore"
            exit 0
          fi
          echo "$CI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ci.jks"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/ci.jks" >> "$GITHUB_ENV"

      - name: Build release bundle + universal APK
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: ./gradlew bundleRelease packageReleaseUniversalApk

      # Estimate what Play actually delivers: split APKs for one device, compressed for download.
      - name: Estimate Play download size
        run: |
          curl -fsSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=app.apks
          echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["vi-VN"],"screenDensity":480,"sdkVersion":34}' > device.json
          java -jar bundletool.jar get-size total --apks=app.apks --device-spec=device.json > size_device.csv
          java -jar bundletool.jar get-size total --apks=app.apks > size_total.csv

          mb() { awk -v b="$1" 'BEGIN { printf "%.1f MB", b / 1048576 }'; }
          device=$(sed -n 2p size_device.csv | cut -d, -f2)
          min=$(sed -n 2p size_total.csv | cut -d, -f1)
          max=$(sed -n 2p size_total.csv | cut -d, -f2)
          apk=$(stat -c %s app/build/outputs/apk_from_bundle/release/app-release-universal.apk)
          aab=$(stat -c %s app/build/outputs/bundle/release/app-release.aab)

          cat > release_notes.md <<EOF
          Commit: \`${GITHUB_SHA::7}\`

          ### Dung lượng tải về từ Google Play (ước tính bằng bundletool ${BUNDLETOOL_VERSION})

          | | Dung lượng |
          |---|---|
          | **Máy arm64, xxhdpi, tiếng Việt** | **$(mb "$device")** |
          | Khoảng dao động theo mọi cấu hình máy | $(mb "$min") – $(mb "$max") |

          ### File trong bản build này

          | File | Dung lượng | Ghi chú |
          |---|---|---|
          | \`magic-hand-release.apk\` | $(mb "$apk") | Bản universal để cài thử, chứa mọi density/ngôn ngữ nên **nặng hơn bản Play**. Số người dùng thật tải về là bảng phía trên. |
          | \`.aab\` (không đính kèm) | $(mb "$aab") | File upload lên Play |
          EOF
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

          mv app/build/outputs/apk_from_bundle/release/app-release-universal.apk magic-hand-release.apk

      # The `latest` release is reused, so drop assets from older builds (e.g. the old debug APK).
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset latest "$asset" -y
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Magic Hand Latest Build
          body_path: release_notes.md
          files: magic-hand-release.apk
